<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a140f">
<title>Football Tuesday</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<style>
  :root{
    --bg:#0e1a14; --card:#15251c; --card2:#1c3125; --line:#2a4535;
    --text:#e9f2ec; --muted:#93ab9c; --accent:#3ddc84; --accent-d:#2bb36a;
    --danger:#ff5d5d; --gk:#f4b942; --def:#4aa3ff; --mid:#3ddc84; --fwd:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{max-width:100%;overflow-x:hidden}
  .team li .li-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .team li .stars,.pos{flex-shrink:0}
  .next .big-date{font-size:19px;font-weight:800}
  /* short landscape screens (phones turned sideways): keep the whole pitch on screen */
  @media (orientation:landscape) and (max-height:520px){
    svg.pitch{max-height:calc(100vh - 40px);width:auto;margin:0 auto}
    header{padding:8px 14px} nav{padding:4px 10px}
  }
  /* very small phones (iPhone SE, small Android) */
  @media (max-width:374px){
    main{padding:8px}
    .card{padding:11px}
    .checkgrid{gap:5px}
    .chk{padding:8px 6px;gap:5px;font-size:14px}
    .chk input{width:15px;height:15px}
    .chk .pos{min-width:27px;font-size:9.5px;padding:2px 3px}
    .next .big-date{font-size:16px}
    nav#tabs button{font-size:9.5px}
    nav#tabs button .ico{font-size:18px}
    .lang button{padding:5px 8px}
  }
  img,svg{max-width:100%}
  .row > *,.chk,.team,.kpi,.rrow,.rate-row > *,.cal-cell,.session{min-width:0}
  .nm,.team li,.rrow span:first-child,.rate-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:#0a140f;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{margin:0;font-size:20px;letter-spacing:.3px}
  header .auth{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  nav{display:flex;gap:4px;padding:8px 12px;background:#0a140f;border-bottom:1px solid var(--line);overflow-x:auto}
  nav button{background:none;border:none;color:var(--muted);padding:9px 14px;border-radius:8px;font-size:14px;cursor:pointer;white-space:nowrap}
  nav button.on{background:var(--card2);color:var(--text);font-weight:600}
  main{max-width:1100px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  h2{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .between{justify-content:space-between}
  button,.btn{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-size:14px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#06210f;border-color:var(--accent);font-weight:700}
  button.primary:hover{background:var(--accent-d)}
  button.danger{color:var(--danger);border-color:#5a2a2a}
  button.big{width:100%;padding:14px;font-size:17px;margin-top:14px}
  button:disabled{opacity:.45;cursor:not-allowed}
  .pill{white-space:nowrap;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);font-weight:500}
  .badge{font-size:11px;padding:3px 8px;border-radius:6px;background:#3b3216;color:var(--gk)}
  .hint{color:var(--muted);font-size:13px;margin:4px 0 10px}
  .pos{display:inline-block;min-width:36px;text-align:center;font-size:11px;font-weight:700;padding:2px 5px;border-radius:5px;color:#06140c}
  .pos.alt{opacity:.55;min-width:30px;font-size:10px}
  .pos-GK{background:var(--gk)} .pos-DEF{background:var(--def)} .pos-MID{background:var(--mid)} .pos-FWD{background:var(--fwd)}
  .checkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr));gap:8px}
  .chk{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:var(--card2);user-select:none}
  .chk input{accent-color:var(--accent);width:17px;height:17px}
  .chk.on{border-color:var(--accent);background:#173a26}
  .chk .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .tablewrap{overflow-x:auto}
  .stars{color:var(--gk);letter-spacing:1px;white-space:nowrap}
  .muted{color:var(--muted)}
  .pitchwrap{background:#0b3d1f;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  svg.pitch{display:block;width:100%;height:auto}
  svg .pl{cursor:pointer}
  svg .pl circle{transition:stroke .15s}
  svg .pl.sel circle{stroke:#ffe14d;stroke-width:6}
  svg .pl text{pointer-events:none;font-family:system-ui,sans-serif;text-anchor:middle}
  svg .pl .p{font-size:17px;font-weight:800;fill:#fff}
  svg .pl .n{font-size:19px;font-weight:700;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.7);stroke-width:5px}
  .teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
  .team{background:var(--card2);border-radius:10px;padding:12px;border-top:6px solid;box-shadow:inset 0 0 0 1px var(--line)}
  .team h3{margin:0 0 6px;font-size:16px}
  .team ul{list-style:none;padding:0;margin:8px 0 0}
  .team li{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:14px}
  .bar{height:10px;background:var(--accent);border-radius:5px;min-width:2px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:12px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .kpi .v{font-size:26px;font-weight:800}
  .kpi .l{color:var(--muted);font-size:13px}
  input[type=text],input[type=date],input[type=number],select{background:#0e1a14;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
  input[type=number]{width:62px;text-align:center}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
  #modal.open{display:flex}
  .dialog{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:440px;max-height:92vh;overflow:auto}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
  .field input[type=text],.field select{width:100%}
  .radio{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:14px;cursor:pointer}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#06210f;border:1px solid var(--accent);color:var(--text);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
  #toast.show{opacity:1}
  .session{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--card2)}
  .score{font-size:20px;font-weight:800}
  .empty{color:var(--muted);text-align:center;padding:24px}
  .card.next{background:linear-gradient(135deg,#173a26,#15251c);border-color:#2f6b47}
  a.btn{text-decoration:none;display:inline-block}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .cal-h{text-align:center;font-size:12px;color:var(--muted);padding:4px 0;font-weight:600}
  .cal-h.tue{color:var(--accent)}
  .cal-cell{min-height:64px;border-radius:8px;background:#122019;padding:6px;display:flex;flex-direction:column;gap:4px;font-size:13px;border:1px solid transparent}
  .cal-cell.empty{background:none}
  .cal-cell .dn{color:var(--muted);font-weight:600}
  .cal-cell.tue{background:var(--card2);border-color:var(--line);cursor:pointer}
  .cal-cell.tue .dn{color:var(--text)}
  .cal-cell.has{background:#173a26;border-color:var(--accent);cursor:pointer}
  .cal-cell.next{border-color:var(--gk)}
  .cal-cell.today .dn{background:var(--accent);color:#06210f;border-radius:6px;padding:0 5px;align-self:flex-start}
  .cal-cell.sel{outline:2px solid #ffe14d}
  .cal-cell .ev{font-size:12px;font-weight:700}
  .search{display:flex;align-items:center;gap:8px;background:#0e1a14;border:1px solid var(--line);border-radius:10px;padding:4px 10px;margin:4px 0 10px}
  .search:focus-within{border-color:var(--accent)}
  .search input{flex:1;background:none;border:none;color:var(--text);font-size:15px;padding:8px 0;outline:none}
  .search input::-webkit-search-cancel-button{display:none}
  .search button{background:none;border:none;color:var(--muted);padding:4px 6px}
  .lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .lang button{border:none;border-radius:0;padding:6px 10px;font-size:13px;background:none;color:var(--muted)}
  .lang button.on{background:var(--accent);color:#06210f;font-weight:700}
  .help{padding-left:20px;line-height:1.6} .help li{margin-bottom:6px}
  .card h3{margin:16px 0 4px;font-size:15px} .card p{line-height:1.55;margin:4px 0}
  nav button .ico{margin-right:6px} nav button .lbl-s{display:none}
  .dlg-foot{position:sticky;bottom:-18px;background:var(--card);padding:12px 0 14px;margin-top:12px;border-top:1px solid var(--line)}
  .split-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:14px}
  .split-row .big{margin-top:0;width:auto} .split-row button:not(.primary){padding:14px 18px}
  button.mini{padding:2px 8px;font-size:14px;border-radius:7px;flex-shrink:0;line-height:1.4}
  .team li{gap:6px}
  .bench{margin:10px 0 12px;padding:12px;border:1px dashed var(--gk);border-radius:10px;background:#1d2a17}
  .bench-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:6px}
  .bench-row{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:8px;padding:6px 8px;min-width:0}
  .bench-row .li-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bench-row .team-a{background:#111;border-color:#555} .bench-row .team-b{background:#f5f5f5;border-color:#ccc}
  .ratings{margin-top:12px;padding:12px;border-radius:10px;background:#122019;border:1px solid var(--line)}
  .motm{margin:10px 0 4px;font-size:15px}
  .rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:6px 16px;margin-top:8px}
  .rrow{display:grid;grid-template-columns:1fr 80px 34px;gap:8px;align-items:center;font-size:14px}
  .rbar{height:8px;background:#0b1510;border-radius:4px;overflow:hidden}
  .rbar span{display:block;height:100%;background:var(--gk)}
  .rate-row{display:grid;grid-template-columns:1fr 70px 44px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
  @media (max-width:640px){
    body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
    header{padding:10px 12px;gap:6px}
    header h1{font-size:17px}
    header .badge{font-size:10px;padding:2px 6px}
    nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;grid-template-columns:repeat(6,1fr);gap:0;padding:4px 2px calc(4px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-bottom:none;overflow:visible;box-shadow:0 -6px 18px rgba(0,0,0,.35)}
    nav#tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 4px;font-size:10.5px;border-radius:10px;min-width:0}
    nav#tabs button .ico{font-size:20px;margin:0;line-height:1.1}
    nav#tabs button .lbl{display:none} nav#tabs button .lbl-s{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    nav#tabs button.on{background:var(--card2);color:var(--accent)}
    #toast{bottom:calc(84px + env(safe-area-inset-bottom));max-width:92vw;text-align:center}
    .card{padding:13px;border-radius:12px;margin-bottom:12px}
    h2{font-size:16px}
    input[type=text],input[type=date],input[type=number],input[type=search],select{font-size:16px}
    button{padding:9px 12px}
    /* players: table becomes cards */
    .ptable tr:first-child{display:none}
    .ptable tr{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:5px;padding:11px 2px;border-bottom:1px solid var(--line)}
    .ptable td{border:none;padding:0}
    .ptable td:nth-child(1){grid-column:1;grid-row:1;font-size:16px}
    .ptable td:nth-child(2){grid-column:1;grid-row:2}
    .ptable td:nth-child(3){grid-column:1;grid-row:3;font-size:13px}
    .ptable td:nth-child(4){grid-column:2;grid-row:3;text-align:right;font-size:13px;color:var(--muted)}
    .ptable td:nth-child(6){grid-column:2;grid-row:1 / span 2;align-self:center}
    /* stats: compact */
    .stable th,.stable td{padding:8px 4px;font-size:13px}
    .stable tr > :nth-child(1),.stable tr > :nth-child(6),.stable tr > :nth-child(7){display:none}
    /* modal = full-screen sheet */
    #modal{padding:0;align-items:flex-end}
    .dialog{max-width:100%;max-height:94vh;border-radius:16px 16px 0 0;padding:16px 16px 0}
    .dlg-foot{bottom:0;margin-bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
    .rate-row{grid-template-columns:1fr 76px 40px}
    /* calendar */
    .cal{gap:3px} .cal-cell .evt:not(.sc){display:none}
    .kpi .v{font-size:21px}
    .session{padding:10px}
  }
  @media (max-width:640px){ .cal-cell{min-height:48px;padding:4px;font-size:12px} .cal-cell .ev{font-size:10px} }
  @media (max-width:640px){ .teams{grid-template-columns:minmax(0,1fr)} main{padding:10px} th.hide-m,td.hide-m{display:none}
    .checkgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px} .chk{padding:8px 7px;font-size:14px} .pitchwrap{max-width:460px;margin:0 auto} }
</style>
</head>

<nav id="tabs">

<main id="app"><div class="empty">Loading…</div></main>
<div id="modal"></div>
<div id="toast"></div>

function tr(text) {
  if (LANG !== "bg" || !text) return text;
  const core = text.trim(); if (!core) return text;
  let out = BG[core];
  if (out == null) for (const [rx, r] of BG_RX) if (rx.test(core)) { out = core.replace(rx, r); break; }
  if (out == null) return text;
  return text.slice(0, text.indexOf(core)) + out + text.slice(text.indexOf(core) + core.length);
}

  if (n.nodeType !== 1 || skip(n)) return;
  for (const a of ["title", "placeholder"]) if (n.hasAttribute?.(a)) { const v = tr(n.getAttribute(a)); if (v !== n.getAttribute(a)) n.setAttribute(a, v); }
  const w = document.createTreeWalker(n, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
  let x; while ((x = w.nextNode())) {
    if (x.nodeType === 3) { if (!skip(x)) { const t = tr(x.nodeValue); if (t !== x.nodeValue) x.nodeValue = t; } }
    else for (const a of ["title", "placeholder"]) if (x.hasAttribute(a)) { const v = tr(x.getAttribute(a)); if (v !== x.getAttribute(a)) x.setAttribute(a, v); }
  }
}

async function initLocal() {
  state.myVoter = ls.get("ft_voter", null);

  let sessions = ls.get("ft_sessions", []);
  if (!players) {
    players = demoPlayers();

    ls.set("ft_checked", [...state.checked]);
  }
  const commit = () => {
    ls.set("ft_players", players); ls.set("ft_sessions", sessions);
    state.players = JSON.parse(JSON.stringify(players));
    state.sessions = JSON.parse(JSON.stringify(sessions));
    state.ready = { players: true, sessions: true };
    render();
  };
  api.newId = uid;
  api.upsertPlayers = async list => {
    for (const { id, ...data } of list) {
      const p = players.find(x => x.id === id);
      if (p) Object.assign(p, data); else players.push({ id, ...data });
    }
    commit();
  };
  api.deletePlayer = async id => {
    players = players.filter(p => p.id !== id);
    players.forEach(p => { if (p.pairId === id) { p.pairId = null; p.pairMode = null; } });
    commit();
  };
  api.addSession = async data => { sessions.push({ id: uid(), ...data }); commit(); };
  api.updateSession = async (id, data) => { Object.assign(sessions.find(s => s.id === id), data); commit(); };
  api.deleteSession = async id => { sessions = sessions.filter(s => s.id !== id); commit(); };
  api.signIn = api.signOut = async () => {};
  let votes = ls.get("ft_votes", []);
  state.votes = votes;
  api.voterId = async () => { let v = ls.get("ft_voter", null); if (!v) { v = uid(); ls.set("ft_voter", v); } return v; };
  api.saveVote = async (sessionId, data) => {

}

async function initFirebase() {

  api.deleteSession = id => fs.deleteDoc(fs.doc(db, "sessions", id));
  api.signIn = () => au.signInWithPopup(auth, new au.GoogleAuthProvider());
  api.signOut = () => au.signOut(auth);

    const voter = await api.voterId();
    await fs.setDoc(fs.doc(db, "votes", sessionId + "__" + voter), { sessionId, uid: voter, ...data, updatedAt: Date.now() });

  fs.onSnapshot(fs.collection(db, "votes"), snap => {
    state.votes = snap.docs.map(d => ({ id: d.id, ...d.data() })); render();

  }, err => toast("Could not load matches: " + err.message));
}

/* --------------------------- SPLIT ENGINE --------------------------- */
// Pairs with mode "apart"   → similar players, one goes to each team.
// Pairs with mode "together"→ always on the same team.
// Then run many random valid splits and keep the best-balanced one.
function buildUnits(players) {
  const present = new Map(players.map(p => [p.id, p]));
  const used = new Set(), apart = [], together = [], singles = [];
  for (const p of players) {
    if (used.has(p.id)) continue;
    const mate = p.pairId && present.get(p.pairId);
    if (mate && mate.pairId === p.id && !used.has(mate.id)) {
      used.add(p.id); used.add(mate.id);
      (p.pairMode === "together" ? together : apart).push([p, mate]);
    } else { used.add(p.id); singles.push(p); }
  }
  return { apart, together, singles };
}

function randomSplit({ apart, together, singles, fixedA = [], fixedB = [] }) {
  const A = [...fixedA], B = [...fixedB];
  const smaller = () => A.length < B.length ? A : B.length < A.length ? B : (Math.random() < .5 ? A : B);
  for (const [x, y] of shuffle([...apart])) Math.random() < .5 ? (A.push(x), B.push(y)) : (A.push(y), B.push(x));
  for (const pr of shuffle([...together])) smaller().push(...pr);
  for (const s of shuffle([...singles])) smaller().push(s);
  return { A, B };
}

const alts = p => (p.altPositions || []).filter(k => POSITIONS.includes(k) && k !== p.position);
const canPlay = (p, k) => p.position === k || alts(p).includes(k);

function teamStats(team) {
  const total = team.reduce((s, p) => s + (p.rating || 3), 0);
  const counts = Object.fromEntries(POSITIONS.map(k => [k, team.filter(p => p.position === k).length]));
  // coverage: main position counts 1, each alternative position 0.5
  const cover = Object.fromEntries(POSITIONS.map(k => [k, team.reduce((n, p) => n + (p.position === k ? 1 : alts(p).includes(k) ? 0.5 : 0), 0)]));
  const keepers = team.filter(p => canPlay(p, "GK")).length;
  return { total, avg: team.length ? total / team.length : 0, counts, cover, keepers, size: team.length };
}

function splitCost(A, B) {
  const a = teamStats(A), b = teamStats(B);
  let c = Math.abs(a.total - b.total) * 10;
  for (const k of POSITIONS) c += Math.abs(a.counts[k] - b.counts[k]) * 3 + Math.abs(a.cover[k] - b.cover[k]) * 2;
  if (a.counts.GK + b.counts.GK >= 2 && (a.counts.GK === 0 || b.counts.GK === 0)) c += 60;   // split main keepers
  if (a.keepers + b.keepers >= 2 && (a.keepers === 0 || b.keepers === 0)) c += 60;          // someone able to play in goal on each side
  if (Math.abs(A.length - B.length) > 1) c += 1000;
  return c;
}

function splitTeams(keep = false) {
  const players = state.players.filter(p => state.checked.has(p.id) && p.active !== false);
  if (players.length < 2) return toast("Tick at least 2 players");
  let units;
  if (keep && state.teams) {
    // keep the players already placed by hand, auto-place only the rest
    const fixedA = state.teams.A.map(byId).filter(Boolean), fixedB = state.teams.B.map(byId).filter(Boolean);
    const placed = new Set([...fixedA, ...fixedB].map(p => p.id));
    let rest = players.filter(p => !placed.has(p.id));
    if (!rest.length) return toast("Everyone is already in a team");
    // a player whose pair is already placed follows the pair rule
    for (const p of [...rest]) {
      const mate = p.pairId && byId(p.pairId);
      if (!mate || mate.pairId !== p.id || !placed.has(mate.id)) continue;
      const mateInA = fixedA.includes(mate);
      const toA = p.pairMode === "together" ? mateInA : !mateInA;
      (toA ? fixedA : fixedB).push(p); rest = rest.filter(x => x !== p);
    }
    units = { ...buildUnits(rest), fixedA, fixedB };
  } else units = buildUnits(players);
  let best = null, bestCost = Infinity;
  for (let i = 0; i < SPLIT_ITERATIONS; i++) {
    const s = randomSplit(units);
    const c = splitCost(s.A, s.B);
    if (c < bestCost) { best = s; bestCost = c; if (c === 0 && i > 200) break; }
  }
  state.teams = { A: best.A.map(p => p.id), B: best.B.map(p => p.id) };
  state.selected = null;
  render();
  document.getElementById("lineups")?.scrollIntoView({ behavior: "smooth", block: "start" });
}

// Only totals are ever shown. Ballots store a random browser id, never a name.
function voteResults(sessionId) {
  const ballots = state.votes.filter(v => v.sessionId === sessionId);
  const sum = {}, cnt = {}, motm = {};
  for (const b of ballots) {
    for (const [pid, r] of Object.entries(b.ratings || {})) { if (r >= 1 && r <= 10) { sum[pid] = (sum[pid] || 0) + r; cnt[pid] = (cnt[pid] || 0) + 1; } }
    if (b.motm) motm[b.motm] = (motm[b.motm] || 0) + 1;
  }
  const avg = Object.fromEntries(Object.keys(sum).map(pid => [pid, sum[pid] / cnt[pid]]));
  const topMotm = Object.entries(motm).sort((a, b) => b[1] - a[1]);
  const winner = topMotm.length && (topMotm.length === 1 || topMotm[0][1] > topMotm[1][1]) ? topMotm[0][0] : null;
  return { voters: ballots.length, avg, cnt, motm, winner };
}

function sessionPlayers(s) { return [...(s.teamA || []), ...(s.teamB || [])]; }

function votingOpen(s) {
  const t = today();
  if (s.date > t) return false;
  if (s.date === t && new Date().getHours() < +MATCH.start.split(":")[0]) return false;
  const latest = sortedSessions().find(x => x.date <= t);
  return latest && latest.id === s.id;            // only the most recent played match
}

function resultsBlock(s) {
  const r = voteResults(s.id);
  const open = votingOpen(s);
  if (!r.voters && !open) return "";
  const ranked = sessionPlayers(s).filter(pl => r.avg[pl.id] != null).sort((a, b) => r.avg[b.id] - r.avg[a.id]);
  const mine = state.myVoter && state.votes.find(v => v.sessionId === s.id && v.uid === state.myVoter);
  return `<div class="ratings">
    <div class="row between">
      <b>⭐ Player ratings <span class="pill">${r.voters} vote${r.voters === 1 ? "" : "s"} · anonymous</span></b>

async function submitVote(sessionId) {
  const me = document.getElementById("r-me").value;
  const ratings = {};
  document.querySelectorAll("[data-rate]").forEach(sel => { const pid = sel.dataset.rate; if (sel.value && pid !== me) ratings[pid] = +sel.value; });

function pitchSVG(A, B) {
  const W = 1000, H = 620;
  const portrait = window.innerWidth < 700;           // vertical pitch on phones
  const X = portrait ? { GK: 80, DEF: 195, MID: 305, FWD: 412 } : { GK: 62, DEF: 190, MID: 320, FWD: 440 };
  const P = (x, y) => portrait ? [y, x] : [x, y];       // swap axes in portrait
  let s = portrait
    ? `<svg class="pitch" viewBox="0 0 ${H} ${W}" xmlns="http://www.w3.org/2000/svg"><g transform="matrix(0 1 1 0 0 0)">`
    : `<svg class="pitch" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><g>`;
  for (let i = 0; i < 10; i++) s += `<rect x="${i * 100}" y="0" width="100" height="${H}" fill="${i % 2 ? "#14703a" : "#177c40"}"/>`;
  const L = `stroke="rgba(255,255,255,.85)" stroke-width="3" fill="none"`;
  const [ta, tb] = [P(W / 4, 48), P(W * 3 / 4, 48)];
  const tA = portrait ? [85, 52] : ta, tB = portrait ? [85, W - 30] : tb;
  s += `<rect x="15" y="15" width="${W - 30}" height="${H - 30}" ${L}/>
        <line x1="${W / 2}" y1="15" x2="${W / 2}" y2="${H - 15}" ${L}/>
        <circle cx="${W / 2}" cy="${H / 2}" r="75" ${L}/><circle cx="${W / 2}" cy="${H / 2}" r="4" fill="#fff"/>
        <rect x="15" y="150" width="140" height="320" ${L}/><rect x="15" y="235" width="50" height="150" ${L}/>
        <rect x="${W - 155}" y="150" width="140" height="320" ${L}/><rect x="${W - 65}" y="235" width="50" height="150" ${L}/>
        <rect x="3" y="270" width="12" height="80" ${L}/><rect x="${W - 15}" y="270" width="12" height="80" ${L}/></g>
        <text x="${tA[0]}" y="${tA[1]}" text-anchor="middle" font-size="22" font-weight="800" fill="${TEAMS.A.color}" style="paint-order:stroke;stroke:${TEAMS.A.ink};stroke-width:4px">${esc(TEAMS.A.name)}</text>
        <text x="${tB[0]}" y="${tB[1]}" text-anchor="middle" font-size="22" font-weight="800" fill="${TEAMS.B.color}" style="paint-order:stroke;stroke:${TEAMS.B.ink};stroke-width:4px">${esc(TEAMS.B.name)}</text>`;
  const draw = (team, key, mirror) => {
    const lines = { GK: [], DEF: [], MID: [], FWD: [] };
    const sorted = team.slice().sort((a, b) => (b.rating || 0) - (a.rating || 0));
    // goalkeeper: best main GK, otherwise someone with GK as an alternative position
    const keeper = sorted.find(p => p.position === "GK") || sorted.find(p => alts(p).includes("GK"));
    sorted.forEach(p => {
      let pos;
      if (p === keeper) pos = "GK";
      else if (p.position !== "GK" && POSITIONS.includes(p.position)) pos = p.position;
      else pos = alts(p).find(k => k !== "GK") || "DEF";      // spare keeper plays outfield
      p._slot = pos;
      lines[pos].push(p);
    });
    for (const pos of POSITIONS) {
      const arr = lines[pos];
      arr.forEach((p, i) => {
        const [x, y] = P(mirror ? W - X[pos] : X[pos], 40 + (H - 60) * (i + 1) / (arr.length + 1));
        const sel = state.selected && state.selected.id === p.id;
        const parts = p.name.trim().split(/\s+/);
        let nm = parts.length > 1 && p.name.length > 9 ? `${parts[0]} ${parts[parts.length - 1][0]}.` : p.name;
        const maxc = portrait ? 9 : 11;
        if (nm.length > maxc) nm = nm.slice(0, maxc - 1) + "…";
        const R = portrait ? 40 : 30;
        s += `<g class="pl ${sel ? "sel" : ""}" data-action="pick" data-team="${key}" data-id="${p.id}" transform="translate(${x},${y})">
          <circle r="${R}" fill="${TEAMS[key].color}" stroke="${TEAMS[key].ink}" stroke-width="3"/>
          <text class="p" y="${portrait ? 8 : 6}" style="fill:${TEAMS[key].ink};font-size:${portrait ? 22 : 17}px">${esc(p._slot || p.position)}</text>
          <text class="n" y="${R + (portrait ? 28 : 24)}" style="font-size:${portrait ? 25 : 19}px">${esc(nm)}</text></g>`;
      });
    }
  };
  draw(A, "A", false); draw(B, "B", true);
  return s + `</svg>`;
}

// search: case-insensitive, Cyrillic typed input also matches Latin names (and vice versa)
const CYR = { а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ж:"zh",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"ts",ч:"ch",ш:"sh",щ:"sht",ъ:"a",ь:"y",ю:"yu",я:"ya" };
const norm = t => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[а-я]/g, c => CYR[c] ?? c);
const playerHay = p => norm([p.name, p.position, ...alts(p)].join(" "));
const matchesSearch = (p, q) => !q || playerHay(p).includes(norm(q));
function applyPlayerSearch() {
  const q = state.playerSearch || "";
  let shown = 0;
  document.querySelectorAll("tr[data-pid]").forEach(tr => {
    const p = byId(tr.dataset.pid); const ok = p && matchesSearch(p, q);
    tr.style.display = ok ? "" : "none"; if (ok) shown++;
  });
  const none = document.getElementById("p-none"); if (none) none.style.display = shown ? "none" : "";
}

  return `

function aggregateStats() {
  const sessions = state.sessions.filter(s => state.statsYear === "all" || (s.date || "").startsWith(state.statsYear));
  const map = new Map();
  for (const s of sessions) {
    const scored = Number.isFinite(s.scoreA) && Number.isFinite(s.scoreB);
    for (const side of ["A", "B"]) {
      for (const pl of (side === "A" ? s.teamA : s.teamB) || []) {
        const r = map.get(pl.id) || { id: pl.id, name: pl.name, apps: 0, w: 0, d: 0, l: 0, last: "" };
        r.apps++;
        if (scored) {
          const mine = side === "A" ? s.scoreA : s.scoreB, theirs = side === "A" ? s.scoreB : s.scoreA;
          mine > theirs ? r.w++ : mine < theirs ? r.l++ : r.d++;
        }
        if ((s.date || "") > r.last) r.last = s.date;
        map.set(pl.id, r);
      }
    }
  }
  for (const r of map.values()) { const p = byId(r.id); if (p) r.name = p.name; r.rsum = 0; r.rn = 0; r.motm = 0; }
  for (const s of sessions) {
    const vr = voteResults(s.id);
    for (const [pid, a] of Object.entries(vr.avg)) { const r = map.get(pid); if (r) { r.rsum += a; r.rn++; } }
    if (vr.winner && map.get(vr.winner)) map.get(vr.winner).motm++;
  }
  return { rows: [...map.values()].sort((a, b) => b.apps - a.apps || b.w - a.w || a.name.localeCompare(b.name)), sessions };
}

function viewStats() {
  const years = [...new Set(state.sessions.map(s => (s.date || "").slice(0, 4)).filter(Boolean))].sort().reverse();
  const { rows, sessions } = aggregateStats();
  const max = Math.max(1, ...rows.map(r => r.apps));
  const top = rows[0];
  const topRated = rows.filter(r => r.rn >= 2).sort((a, b) => b.rsum / b.rn - a.rsum / a.rn)[0];
  const bestWin = rows.filter(r => r.w + r.d + r.l >= 3).sort((a, b) => b.w / (b.w + b.d + b.l) - a.w / (a.w + a.d + a.l))[0];
  return `
  <div class="row between" style="margin-bottom:12px">
    <h2 style="margin:0">Statistics</h2>
    <select data-change="stats-year">
      <option value="all">All time</option>
      ${years.map(y => `<option value="${y}" ${state.statsYear === y ? "selected" : ""}>${y}</option>`).join("")}
    </select>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="v">${sessions.length}</div><div class="l">Matches played</div></div>
    <div class="kpi"><div class="v">${rows.length}</div><div class="l">Different players</div></div>
    <div class="kpi"><div class="v">${top ? esc(top.name) : "—"}</div><div class="l">Most appearances${top ? ` (${top.apps})` : ""}</div></div>
    <div class="kpi"><div class="v">${bestWin ? esc(bestWin.name) : "—"}</div><div class="l">Best win rate${bestWin ? ` (${Math.round(100 * bestWin.w / (bestWin.w + bestWin.d + bestWin.l))}%, min 3 results)` : " (min 3 results)"}</div></div>
    <div class="kpi"><div class="v">${topRated ? esc(topRated.name) : "—"}</div><div class="l">Best avg rating${topRated ? ` (${(topRated.rsum / topRated.rn).toFixed(1)})` : " (min 2 rated matches)"}</div></div>
  </div>
  <section class="card">
    ${rows.length ? `<div class="tablewrap"><table class="stable">
      <tr><th>#</th><th>Player</th><th>Apps</th><th class="hide-m" style="width:30%"></th><th>W</th><th>D</th><th>L</th><th>Win %</th><th>⭐ Avg</th><th>🏆</th><th class="hide-m">Last played</th></tr>
      ${rows.map((r, i) => {
        const g = r.w + r.d + r.l;
        return `<tr><td class="muted">${i + 1}</td><td><b>${esc(r.name)}</b></td><td><b>${r.apps}</b></td>
          <td class="hide-m"><div class="bar" style="width:${100 * r.apps / max}%"></div></td>
          <td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${g ? Math.round(100 * r.w / g) + "%" : "—"}</td>
          <td>${r.rn ? (r.rsum / r.rn).toFixed(1) : "—"}</td><td>${r.motm || ""}</td>
          <td class="hide-m muted">${r.last ? fmtDate(r.last) : ""}</td></tr>`;
      }).join("")}
    </table></div>` : `<div class="empty">No matches saved yet. Split the teams on Match day and press <b>Save match</b>.</div>`}
  </section>`;
}

function viewCalendar() {
  const next = nextMatchDate();
  const month = state.calMonth || next.slice(0, 7);
  const [y, m] = month.split("-").map(Number);
  const first = new Date(y, m - 1, 1, 12);
  const daysIn = new Date(y, m, 0).getDate();
  const lead = (first.getDay() + 6) % 7;            // Monday-first grid
  const byDate = new Map(); state.sessions.forEach(s => byDate.set(s.date, s));
  const t = today();
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(`<div class="cal-cell empty"></div>`);
  for (let d = 1; d <= daysIn; d++) {
    const ds = `${month}-${String(d).padStart(2, "0")}`;
    const isTue = parseYmd(ds).getDay() === MATCH.weekday;
    const s = byDate.get(ds);
    const scored = s && Number.isFinite(s.scoreA) && Number.isFinite(s.scoreB);
    const cls = ["cal-cell", isTue ? "tue" : "", s ? "has" : "", ds === t ? "today" : "", ds === next ? "next" : "", ds === state.calSelected ? "sel" : ""].join(" ");
    cells.push(`<div class="${cls}" ${isTue || s ? `data-action="cal-day" data-date="${ds}"` : ""}>
      <span class="dn">${d}</span>
      ${s ? `<span class="ev">⚽ <span class="evt ${scored ? "sc" : ""}">${scored ? `${s.scoreA}:${s.scoreB}` : "saved"}</span></span>` : isTue ? `<span class="ev muted"><span class="evt">${ds === next ? "next" : ds < t ? "–" : MATCH.start}</span></span>` : ""}
    </div>`);
  }
  const title = first.toLocaleDateString(LOCALE, { month: "long", year: "numeric" });
  const sel = state.calSelected;
  const selSession = sel && byDate.get(sel);
  return `
  <section class="card">
    <div class="row between">
      <h2>📅 Calendar</h2>
      <div class="row">
        <a class="btn" href="${googleCalUrl()}" target="_blank" rel="noopener">➕ Google Calendar</a>
        <button data-action="ics">⬇ Add to phone / Outlook (.ics)</button>
      </div>
    </div>
    <p class="hint">Every Tuesday ${MATCH.start}–${MATCH.end}. Tap a Tuesday to see the line-ups from that day.</p>
    <div class="row between" style="margin:8px 0">
      <button data-action="cal-prev">‹</button><b style="font-size:16px">${title}</b><button data-action="cal-next">›</button>
    </div>
    <div class="cal">
      ${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => `<div class="cal-h ${d === "Tue" ? "tue" : ""}">${d}</div>`).join("")}
      ${cells.join("")}
    </div>
    ${month !== next.slice(0, 7) ? `<div style="text-align:center;margin-top:10px"><button data-action="cal-today">Back to this month</button></div>` : ""}
  </section>
  ${sel ? (selSession ? `<section class="card">${sessionCard(selSession)}</section>`
       : `<section class="card empty">No line-ups saved for ${fmtDate(sel)}.${sel >= t ? " Split the teams on <b>Match day</b> and press <b>Save match</b>." : ""}</section>`) : ""}`;
}

function googleCalUrl() {
  const d = nextMatchDate().replace(/-/g, "");
  const st = MATCH.start.replace(":", "") + "00", en = MATCH.end.replace(":", "") + "00";
  const q = new URLSearchParams({
    action: "TEMPLATE", text: MATCH.title, dates: `${d}T${st}/${d}T${en}`, ctz: MATCH.tz,
    recur: "RRULE:FREQ=WEEKLY;BYDAY=TU", details: "Weekly game. Line-ups: " + location.href.split("?")[0], location: MATCH.location
  });
  return "https://calendar.google.com/calendar/render?" + q.toString();
}

function downloadIcs() {
  const d = nextMatchDate().replace(/-/g, "");
  const st = MATCH.start.replace(":", "") + "00", en = MATCH.end.replace(":", "") + "00";
  const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Football Tuesday//EN", "CALSCALE:GREGORIAN",
    "BEGIN:VTIMEZONE", "TZID:Europe/Sofia",
    "BEGIN:DAYLIGHT", "TZOFFSETFROM:+0200", "TZOFFSETTO:+0300", "TZNAME:EEST", "DTSTART:19700329T030000", "RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU", "END:DAYLIGHT",
    "BEGIN:STANDARD", "TZOFFSETFROM:+0300", "TZOFFSETTO:+0200", "TZNAME:EET", "DTSTART:19701025T040000", "RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU", "END:STANDARD",
    "END:VTIMEZONE",
    "BEGIN:VEVENT", "UID:football-tuesday-weekly@" + location.host, "DTSTAMP:" + stamp,
    `DTSTART;TZID=Europe/Sofia:${d}T${st}`, `DTEND;TZID=Europe/Sofia:${d}T${en}`,
    "RRULE:FREQ=WEEKLY;BYDAY=TU", "SUMMARY:" + MATCH.title,
    "DESCRIPTION:Weekly game. Line-ups: " + location.href.split("?")[0],
    MATCH.location ? "LOCATION:" + MATCH.location : "",
    "BEGIN:VALARM", "TRIGGER:-PT2H", "ACTION:DISPLAY", "DESCRIPTION:Football tonight 20:00", "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"
  ].filter(Boolean).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));

}

async function savePlayer(existingId) {
  const name = document.getElementById("f-name").value.trim();
  if (!name) return toast("Please enter a name");
  const id = existingId || api.newId();
  const old = existingId ? byId(existingId) : null;
  const pairId = document.getElementById("f-pair").value || null;
  const pairMode = pairId ? document.querySelector("input[name=f-mode]:checked").value : null;
  const updates = new Map();
  const put = (pid, data) => updates.set(pid, { ...(updates.get(pid) || {}), id: pid, ...data });
  // break old links that change
  if (old?.pairId && old.pairId !== pairId) put(old.pairId, { pairId: null, pairMode: null });
  if (pairId) {
    const mate = byId(pairId);
    if (mate?.pairId && mate.pairId !== id) put(mate.pairId, { pairId: null, pairMode: null });
    put(pairId, { pairId: id, pairMode });
  }
  put(id, {
    name, position: document.getElementById("f-pos").value,
    altPositions: [...new Set([0, 1].map(i => document.getElementById("f-alt" + i).value).filter(v => v && v !== document.getElementById("f-pos").value))],
    rating: +document.getElementById("f-rating").value,
    active: document.getElementById("f-active").checked, pairId, pairMode
  });
  closeModal();
  await guarded(() => api.upsertPlayers([...updates.values()]), existingId ? "Player updated" : `${name} added`);
  if (!existingId) { state.checked.add(id); ls.set("ft_checked", [...state.checked]); render(); }
}

/* ------------------------------ ACTIONS ----------------------------- */
function shareText() {
  const { A, B } = currentTeams();
  const order = arr => arr.slice().sort((a, b) => POSITIONS.indexOf(a.position) - POSITIONS.indexOf(b.position));
  const dateEl = document.getElementById("matchDate");
  const d = dateEl ? dateEl.value : nextMatchDate();
  const block = (k, arr) => `${TEAMS[k].emoji} *${tr(TEAMS[k].name)}*\n` + order(arr).map(p => `• ${p.name} (${p.position})`).join("\n");
  return `⚽ Football Tuesday · ${fmtDate(d)} · ${MATCH.start}–${MATCH.end} (${tr(formatLabel(A.length + B.length))})\n\n${block("A", A)}\n\n${block("B", B)}`;
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

document.addEventListener("click", async e => {
  const tab = e.target.closest("#tabs button");
  if (tab) { state.tab = tab.dataset.tab; if (location.search) history.replaceState(null, "", location.pathname); render(); window.scrollTo(0, 0); return; }
  if (e.target.id === "modal") return closeModal();
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const { action, id } = el.dataset;
  switch (action) {
    case "signin": guarded(api.signIn); break;
    case "signout": api.signOut(); break;
    case "check-all": state.players.filter(p => p.active !== false).forEach(p => state.checked.add(p.id)); ls.set("ft_checked", [...state.checked]); render(); break;
    case "check-none": state.checked.clear(); ls.set("ft_checked", []); render(); break;
    case "split": splitTeams(); break;
    case "manual":
      state.teams = { A: [], B: [] }; state.selected = null; render();
      document.getElementById("lineups")?.scrollIntoView({ behavior: "smooth", block: "start" });
      break;
    case "autofill": splitTeams(true); break;
    case "place": state.teams[el.dataset.team].push(id); state.selected = null; render(); break;
    case "move": {
      const from = state.teams.A.includes(id) ? "A" : "B", to = from === "A" ? "B" : "A";
      state.teams[from] = state.teams[from].filter(x => x !== id); state.teams[to].push(id);
      state.selected = null; render(); toast("Moved to " + TEAMS[to].name); break;
    }
    case "unplace":
      state.teams.A = state.teams.A.filter(x => x !== id); state.teams.B = state.teams.B.filter(x => x !== id);
      state.selected = null; render(); break;
    case "pick": {
      const team = el.dataset.team;
      const sel = state.selected;
      if (!sel || sel.id === id) state.selected = sel?.id === id ? null : { team, id };
      else if (sel.team === team) state.selected = { team, id };
      else {
        const T = state.teams;
        T[sel.team][T[sel.team].indexOf(sel.id)] = id;
        T[team][T[team].indexOf(id)] = sel.id;
        state.selected = null;
        toast("Players swapped");
      }
      render(); break;
    }
    case "share": {
      const text = shareText();
      try { await navigator.clipboard.writeText(text); } catch {}
      toast("Line-ups copied. Opening Viber… (if it doesn't open, just paste in the group)");
      window.location.href = "viber://forward?text=" + encodeURIComponent(text);
      break;
    }
    case "copy":
      try { await navigator.clipboard.writeText(shareText()); toast("Line-ups copied"); }
      catch { toast("Copy not allowed in this browser"); }
      break;
    case "save-match": {
      if (unassigned().length && !confirm(tr(`${unassigned().length} ticked player(s) are not in a team and won't be saved. Save anyway?`))) break;
      const { A, B } = currentTeams();
      const date = document.getElementById("matchDate").value || today();
      const snap = arr => arr.map(p => ({ id: p.id, name: p.name, position: p.position }));
      const existing = state.sessions.find(s => s.date === date);
      const data = { date, format: formatLabel(A.length + B.length), teamA: snap(A), teamB: snap(B) };
      if (existing) await guarded(() => api.updateSession(existing.id, data), `Line-ups for ${fmtDate(date)} updated ✔`);
      else await guarded(() => api.addSession({ ...data, scoreA: null, scoreB: null, createdAt: Date.now() }), `Match on ${fmtDate(date)} saved ✔`);
      break;
    }
    case "clear-search": state.playerSearch = ""; render(); document.getElementById("p-search")?.focus(); break;
    case "rate": openRateForm(id); break;
    case "share-rate": {
      const s = state.sessions.find(x => x.id === id);
      const text = (LANG === "bg" ? `⭐ Оценете играчите от ${fmtDate(s.date)} (анонимно):\n` : `⭐ Rate the players from ${fmtDate(s.date)} (anonymous):\n`) + rateLink(id);
      try { await navigator.clipboard.writeText(text); } catch {}
      toast("Rating link copied. Opening Viber…");
      window.location.href = "viber://forward?text=" + encodeURIComponent(text);
      break;
    }
    case "lang": ls.set("ft_lang", el.dataset.lang); location.reload(); break;
    case "submit-vote": await submitVote(id); break;
    case "reuse": {
      const s = state.sessions.find(x => x.id === id);
      if (!s) break;
      const ok = arr => (arr || []).map(p => p.id).filter(pid => byId(pid));
      state.teams = { A: ok(s.teamA), B: ok(s.teamB) };
      [...state.teams.A, ...state.teams.B].forEach(pid => state.checked.add(pid));
      ls.set("ft_checked", [...state.checked]);
      state.selected = null; state.tab = "match"; render();
      document.getElementById("lineups")?.scrollIntoView({ behavior: "smooth", block: "start" });
      toast("Teams loaded from " + fmtDate(s.date));
      break;
    }
    case "cal-prev": case "cal-next": {
      const base = state.calMonth || nextMatchDate().slice(0, 7);
      const [y, m] = base.split("-").map(Number);
      const d = new Date(y, m - 1 + (action === "cal-next" ? 1 : -1), 1, 12);
      state.calMonth = ymd(d).slice(0, 7); render(); break;
    }
    case "cal-today": state.calMonth = null; render(); break;
    case "cal-day": state.calSelected = state.calSelected === el.dataset.date ? null : el.dataset.date; render(); break;
    case "ics": downloadIcs(); toast("Calendar file downloaded. Open it to add the weekly match"); break;
    case "save-score": {
      const a = document.getElementById("sa-" + id).value, b = document.getElementById("sb-" + id).value;
      const both = a !== "" && b !== "";
      await guarded(() => api.updateSession(id, { scoreA: both ? +a : null, scoreB: both ? +b : null }), both ? "Score saved" : "Score cleared");
      break;
    }
    case "delete-session": if (confirm(tr("Delete this match? Appearances will be recalculated."))) await guarded(() => api.deleteSession(id), "Match deleted"); break;
    case "new-player": openPlayerForm(null); break;
    case "edit-player": openPlayerForm(id); break;
    case "close-modal": closeModal(); break;
    case "save-player": await savePlayer(id); break;
    case "delete-player": {
      const p = byId(id);
      if (confirm(tr(`Delete ${p?.name}? Their past appearances stay in the stats.`))) {
        closeModal(); state.checked.delete(id); ls.set("ft_checked", [...state.checked]);
        await guarded(() => api.deletePlayer(id), "Player deleted");
      }
      break;
    }
  }
});

document.addEventListener("input", e => {
  if (e.target.id === "p-search") {
    state.playerSearch = e.target.value;
    applyPlayerSearch();
    const box = e.target.parentElement, has = box.querySelector("[data-action=clear-search]");
    if (state.playerSearch && !has) box.insertAdjacentHTML("beforeend", `<button data-action="clear-search" title="Clear">✕</button>`);
    if (!state.playerSearch && has) has.remove();
  }
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-change]");
  if (!el) return;
  if (el.dataset.change === "toggle-check") {
    el.checked ? state.checked.add(el.dataset.id) : state.checked.delete(el.dataset.id);
    ls.set("ft_checked", [...state.checked]); render();
  }
  if (el.dataset.change === "rate-me") {
    state.rateMe = el.value;
    document.querySelectorAll(".rate-row").forEach(r => r.style.display = r.dataset.pid === el.value ? "none" : "");
  }
  if (el.dataset.change === "stats-year") { state.statsYear = el.value; render(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
  if (e.key === "Enter" && document.getElementById("modal").classList.contains("open") && e.target.id === "f-name") document.querySelector("[data-action=save-player]")?.click();
});

let lastPortrait = window.innerWidth < 700;
window.addEventListener("resize", () => {
  const p = window.innerWidth < 700;
  if (p !== lastPortrait && state.tab === "match" && state.teams) { lastPortrait = p; render(); }
});

const qp = new URLSearchParams(location.search);
if (qp.get("rate")) { state.tab = "rate"; state.rateSession = qp.get("rate"); }
(LOCAL_MODE ? initLocal().then(async () => { state.myVoter = ls.get("ft_voter", null); }) : initFirebase()).catch(err => {
  console.error(err);
  document.getElementById("app").innerHTML = `<div class="card empty">Could not start the app: ${esc(err.message)}</div>`;
});
</script>
</body>
</html>
